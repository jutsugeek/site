<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartas Graduadas | JutsuGeek</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #030712;
    --surface: #111827;
    --text: #f3f4f6;
    --muted: #9ca3af;
    --yellow: #facc15;
    --price: #4ade80;
    --promo: #f97316;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .top-bar {
    background: #111827;
    color: #facc15;
    font-size: 0.8rem;
    padding: 0.5rem 1.5rem;
    text-align: center;
    border-bottom: 2px solid rgba(250, 204, 21, 0.4);
  }
  header {
    background: #111827;
    border-bottom: 1px solid rgba(250, 204, 21, 0.25);
    padding: 1rem 1.5rem;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo img {
    height: 48px;
    width: auto;
    filter: drop-shadow(0 0 8px rgba(250, 204, 21, 0.4));
  }
  nav a {
    margin-left: 1.75rem;
    color: #d1d5db;
    text-decoration: none;
    font-weight: 500;
    font-size: 0.95rem;
  }
  nav a:hover, nav a.active { color: #facc15; }
  .social-top {
    background: #111827;
    padding: 0.75rem 1.5rem;
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    flex-wrap: wrap;
    border-bottom: 2px solid rgba(250, 204, 21, 0.4);
  }
  .social-top a {
    color: #facc15;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }
  .social-top a:hover { color: white; }
  .social-top img {
    height: 18px;
    width: 18px;
    filter: invert(1) brightness(0) saturate(100%) invert(78%) sepia(65%) saturate(500%) hue-rotate(5deg);
  }
  .banner img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
    max-height: 220px;
    object-fit: cover;
  }
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }
  .section h2 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 1.25rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid rgba(250, 204, 21, 0.3);
    color: white;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1.5rem;
  }
  .product {
    background: #111827;
    border: 1px solid rgba(250, 204, 21, 0.25);
    border-radius: 16px;
    overflow: hidden;
    transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;
  }
  .product:hover {
    box-shadow: 0 10px 25px -5px rgba(250, 204, 21, 0.15);
    transform: translateY(-2px);
    border-color: rgba(250, 204, 21, 0.7);
  }
  .product-img {
    aspect-ratio: 1;
    background: #030712;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .product-img img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .product-body { padding: 1rem 1.1rem 1.25rem; }
  .product h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.25rem; color: white; }
  .meta { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.6rem; }
  .price { font-size: 1.25rem; font-weight: 700; color: #4ade80; margin-bottom: 0.75rem; }
  .btn {
    display: block;
    text-align: center;
    background: #facc15;
    color: #030712;
    text-decoration: none;
    padding: 0.6rem;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 700;
  }
  .btn:hover { background: #eab308; }
  .badge {
    display: inline-block;
    background: rgba(249, 115, 22, 0.15);
    color: #fb923c;
    font-size: 0.65rem;
    font-weight: 600;
    padding: 0.15rem 0.45rem;
    border-radius: 4px;
    margin-bottom: 0.4rem;
    border: 1px solid rgba(249, 115, 22, 0.3);
  }
  footer {
    background: #111827;
    color: #9ca3af;
    text-align: center;
    padding: 2.5rem 1.5rem;
    font-size: 0.85rem;
    border-top: 2px solid rgba(250, 204, 21, 0.4);
  }
</style>
</head>
<body>
<div class="top-bar">
  Frete grátis acima de R$ 299 em cartas avulsas • Envio rápido • Pau dos Ferros - RN
</div>

<header>
  <div class="header-inner">
    <div class="logo"><a href="/"><img src="/logo.png" alt="JutsuGeek"></a></div>
    <nav>
      <a href="/">Início</a>
      <a href="/sobre.html">Sobre Nós</a>
      <a href="/graduadas/" class="active">Cartas Graduadas</a>
      <a href="/produtos/">Produtos</a>
      <a href="https://mypcards.com/JutsuGeek" target="_blank">Loja Completa</a>
    </nav>
  </div>
</header>

<div class="banner">
  <img src="/banner.png" alt="JutsuGeek Banner">
</div>

<div class="social-top">
  <a href="https://www.instagram.com/jutsu_geek" target="_blank"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/instagram.svg" alt="IG"> Instagram</a>
  <a href="https://www.facebook.com/JutsuGeek" target="_blank"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/facebook.svg" alt="FB"> Facebook</a>
  <a href="https://www.youtube.com/@JutsuGeek" target="_blank"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/youtube.svg" alt="YT"> YouTube</a>
  <a href="https://x.com/jutsugeek" target="_blank"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/x.svg" alt="X"> X</a>
  <a href="http://wa.me/5584988229883" target="_blank"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/whatsapp.svg" alt="WA"> WhatsApp</a>
  <a href="https://www.pinterest.com/jutsugeek" target="_blank"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/pinterest.svg" alt="Pin"> Pinterest</a>
</div>

<div class="container">
  <section class="section">
    <h2>Cartas Graduadas</h2>
    <div class="grid" id="grid"></div>
  </section>
</div>

<script>
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT8b-QvuBfx53su8LQsbAnocJW4CDnViiheY89jwf4TsPwnzPfUgpiRzn6UG-FCV1SrlMfVByRT8wm3/pub?gid=834701060&single=true&output=csv';

async function loadProducts() {
  try {
    const res = await fetch(SHEET_CSV_URL);
    const text = await res.text();

    function parseCSV(csv) {
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;
      for (let i = 0; i < csv.length; i++) {
        const char = csv[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          row.push(field);
          field = '';
        } else if (char === '\n' && !inQuotes) {
          row.push(field);
          if (row.some(c => c.trim())) rows.push(row);
          row = [];
          field = '';
        } else {
          field += char;
        }
      }
      if (field || row.length) {
        row.push(field);
        if (row.some(c => c.trim())) rows.push(row);
      }
      return rows.map(r => r.map(c => c.trim().replace(/^"|"$/g, '')));
    }

    const allRows = parseCSV(text);
    const products = allRows.slice(1).map(cols => ({
      name: cols[0] || '',
      category: cols[1] || '',
      price: cols[2] || '',
      meta: cols[3] || '',
      image: cols[4] || '',
      link: cols[5] || '',
      badge: cols[6] || ''
    })).filter(p => p.name && p.image && p.category.toLowerCase().includes('gradu'));

    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    if (products.length === 0) {
      grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#9ca3af;">Nenhuma carta graduada cadastrada.</p>';
      return;
    }

    products.forEach(p => {
      const card = document.createElement('div');
      card.className = 'product';
      card.innerHTML = `
        <div class="product-img">
          <img src="${p.image}" alt="${p.name}" onerror="this.parentElement.innerHTML='<div style=\\'padding:2rem;color:#666\\'>Sem imagem</div>'">
        </div>
        <div class="product-body">
          ${p.badge ? `<span class="badge">${p.badge}</span>` : ''}
          <h3>${p.name}</h3>
          ${p.meta ? `<div class="meta">${p.meta}</div>` : ''}
          <div class="price">${p.price ? 'R$ ' + p.price : 'Ver preço'}</div>
          <a class="btn" href="${p.link}" target="_blank">Ver na MYP</a>
        </div>
      `;
      grid.appendChild(card);
    });
  } catch (e) {
    console.error(e);
    document.getElementById('grid').innerHTML = '<p>Erro ao carregar a planilha.</p>';
  }
}

loadProducts();
</script>

<footer>
  JutsuGeek • Pau dos Ferros - RN
</footer>
</body>
</html>
